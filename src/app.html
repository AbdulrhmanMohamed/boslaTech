<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<link rel="dns-prefetch" href="https://fonts.googleapis.com" />
		<link rel="dns-prefetch" href="https://fonts.gstatic.com" crossorigin />
		<link rel="preconnect" href="https://fonts.googleapis.com" crossorigin />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
		<link
			href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@100..700&family=IBM+Plex+Sans+Arabic:wght@100..700&family=Outfit:wght@100..900&family=Orbitron:wght@400..900&family=Cinzel:wght@400..900&family=Caveat:wght@400..700&display=swap"
			rel="stylesheet"
			media="print" onload="this.media='all'; this.onload=null;"
		/>
		<noscript><link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@100..700&family=IBM+Plex+Sans+Arabic:wght@100..700&family=Outfit:wght@100..900&family=Orbitron:wght@400..900&family=Cinzel:wght@400..900&family=Caveat:wght@400..700&display=swap" rel="stylesheet" /></noscript>
		<style>
			@font-face {
				font-family: 'IBM Plex Sans';
				font-display: swap;
			}
			@font-face {
				font-family: 'IBM Plex Sans Arabic';
				font-display: swap;
			}
			@font-face {
				font-family: 'Outfit';
				font-display: swap;
			}
			@font-face {
				font-family: 'Orbitron';
				font-display: swap;
			}
			@font-face {
				font-family: 'Cinzel';
				font-display: swap;
			}
		</style>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
