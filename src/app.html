<!doctype html>
<html lang="en" data-theme="light">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<link rel="preconnect" href="https://fonts.googleapis.com" crossorigin />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
		<link
href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400..700&family=IBM+Plex+Sans+Arabic:wght@400..700&display=swap"
			rel="stylesheet"
			media="print" onload="this.media='all'; this.onload=null;"
		/>
		<noscript><link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400..700&family=IBM+Plex+Sans+Arabic:wght@400..700&display=swap" rel="stylesheet" /></noscript>
		<style>
			@font-face {
				font-family: 'IBM Plex Sans';
				font-display: swap;
			}
			@font-face {
				font-family: 'IBM Plex Sans Arabic';
				font-display: swap;
			}
		</style>
		<script>
			// Prevent theme flash: default to light (matches server default)
			(function () {
				try {
					var saved = localStorage.getItem('theme');
					var theme = saved === 'dark' ? 'dark' : 'light';
					document.documentElement.setAttribute('data-theme', theme);
					document.documentElement.style.colorScheme = theme;
					// Also handle direction: default to ltr since English is default
					var savedLang = localStorage.getItem('language');
					var lang = savedLang === 'ar' ? 'rtl' : 'ltr';
					document.documentElement.setAttribute('dir', lang);
				} catch (e) {}
			})();
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
